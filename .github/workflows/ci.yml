# CI/CD pipeline for FLOX Farm Health API
name: CI/CD

on:
  push:
    branches: [main, feat*]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/farm-health-api
  APP_VERSION: "0.1.0"

jobs:
  # Stage 1: Build the Docker image and tag with version + latest
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build image
      run: |
        docker build -t ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} \
                     -t ${{ env.IMAGE_NAME }}:latest .

    - name: Save image for next stages
      run: |
        docker save ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} \
          -o /tmp/image.tar

    - uses: actions/upload-artifact@v4
      with:
        name: docker-image
        path: /tmp/image.tar
        retention-days: 1

  # Stage 2: Smoke test (run the container and verify health)
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp

    - name: Load image
      run: docker load -i /tmp/image.tar

    - name: Run container and smoke test
      run: |
        docker run -d -p 8000:8000 --name test-container \
          ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
        sleep 5

        # Verify /health returns 200 with "status":"healthy"
        RESPONSE=$(curl -sf http://localhost:8000/health)
        echo "$RESPONSE" | grep -q '"status":"healthy"' || exit 1
        echo "Health check passed"

        # Verify /ready returns 200 with "ready":true
        RESPONSE=$(curl -sf http://localhost:8000/ready)
        echo "$RESPONSE" | grep -q '"ready":true' || exit 1
        echo "Readiness check passed"

    - name: Cleanup test container
      if: always()
      run: docker rm -f test-container 2>/dev/null || true

  # Stage 3: Push image to container registry (version tag + latest)
  push:
    name: Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push with version + latest tags
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # Stage 4: Deploy to a Kind cluster to validate K8s manifests and create a real cluster, loads the image, applies manifests, and runs healthcheck.
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: docker-image
        path: /tmp

    - name: Load image
      run: docker load -i /tmp/image.tar

    - name: Create Kind cluster
      uses: helm/kind-action@v1
      with:
        cluster_name: flox-farm
        config: kind-config.yaml

    - name: Tag image to match K8s manifest and load into Kind
      run: |
        docker tag ${{ env.IMAGE_NAME }}:${{ env.APP_VERSION }} flox/farm-health-api:0.1.0
        kind load docker-image flox/farm-health-api:0.1.0 --name flox-farm

    - name: Apply K8s manifests
      run: |
        kubectl apply -f k8s/namespace.yaml
        sleep 2
        kubectl apply -f k8s/configmap.yaml \
                      -f k8s/deployment.yaml \
                      -f k8s/service.yaml \
                      -f k8s/hpa.yaml

    - name: Wait for pods
      run: |
        kubectl wait --for=condition=ready pod -l app=farm-health-api \
          -n flox-farm --timeout=90s

    - name: Verify deployment
      run: |
        kubectl get pods -n flox-farm
        kubectl get svc -n flox-farm

    - name: Run health check against cluster
      run: |
        # Port-forward in background
        kubectl port-forward svc/farm-health-api-service -n flox-farm 8080:80 &
        sleep 3

        # Run the health check script
        chmod +x healthcheck.sh
        ./healthcheck.sh http://localhost:8080

  # Notify on failure via Slack webhook
  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [build, test, push, deploy]
    if: failure()
    steps:
    - name: Slack notification
      uses: slackapi/slack-github-action@v1.24.0
      with:
        payload: |
          {
            "text": "Pipeline failed: ${{ github.repository }} (${{ github.ref_name }})\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
